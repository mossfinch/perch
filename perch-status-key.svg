<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" role="img" aria-label="The collapsed island reports how many projects are running, waiting for you, and finished.">
  <title>What Perch shows at a glance</title>
  <desc>A dark capsule shows three counts side by side: blue for agents running, yellow for agents waiting on your approval, green for runs that finished. A state with nothing in it is not shown.</desc>

  <!-- Colors are the app's own palette (Interface/IslandView.swift). The panel
       is dark on purpose: it renders the same in light and dark README themes. -->
  <rect width="720" height="268" rx="18" fill="#14100F"/>

  <!-- The collapsed island, drawn at its real proportions -->
  <rect x="234" y="38" width="252" height="58" rx="29" fill="#1F1A18" stroke="#3A312E" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" font-weight="600" text-anchor="middle">
    <text x="304" y="76" fill="#479EFA">2</text>
    <text x="360" y="76" fill="#FFCC3D">1</text>
    <text x="416" y="76" fill="#4DC775">3</text>
  </g>

  <text x="360" y="126" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13.5" fill="#FEFEFD" fill-opacity="0.48" text-anchor="middle">this is the whole widget when collapsed — it lives in the notch</text>

  <!-- Legend -->
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">
    <g transform="translate(92 172)">
      <circle cx="0" cy="-5" r="7" fill="#479EFA"/>
      <text x="20" y="0" fill="#FEFEFD" font-weight="600">2 running</text>
      <text x="20" y="22" fill="#FEFEFD" fill-opacity="0.62" font-size="13.5">agents are working</text>
    </g>
    <g transform="translate(288 172)">
      <circle cx="0" cy="-5" r="7" fill="#FFCC3D"/>
      <text x="20" y="0" fill="#FEFEFD" font-weight="600">1 waiting</text>
      <text x="20" y="22" fill="#FEFEFD" fill-opacity="0.62" font-size="13.5">one needs your approval</text>
    </g>
    <g transform="translate(510 172)">
      <circle cx="0" cy="-5" r="7" fill="#4DC775"/>
      <text x="20" y="0" fill="#FEFEFD" font-weight="600">3 done</text>
      <text x="20" y="22" fill="#FEFEFD" fill-opacity="0.62" font-size="13.5">those runs finished</text>
    </g>
  </g>

  <rect x="60" y="212" width="600" height="1" fill="#FEFEFD" fill-opacity="0.10"/>
  <text x="360" y="242" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#FEFEFD" fill-opacity="0.72" text-anchor="middle">A state with nothing in it is not shown. Hover, and it unfolds into one row per project.</text>
</svg>
